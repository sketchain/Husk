# XcodeGen 工程定义。在 Mac 上执行 `xcodegen generate` 产出 Husk.xcodeproj。
# 仓库里刻意不提交 .xcodeproj：pbxproj 手写极易损坏，而本仓库的生成环境没有 Xcode 可供验证。
name: Husk

options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"                 # Swift 6 语言模式（严格并发检查）
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17

targets:
  Husk:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: Husk
        PRODUCT_BUNDLE_IDENTIFIER: org.example.husk   # ← 改成你自己的
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"                 # iPhone + iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                          # ← 填你的 Team ID，或在 Xcode 里选
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    # 不写 dependencies：Swift 对 `import WebKit` / `import CryptoKit` 会自动链接，
    # 手写 sdk 依赖只是多一处可能写错框架名的地方。

# 显式定义 scheme。XcodeGen 默认不生成，而 Xcode 只在 GUI 里打开工程时才自动补，
# CI 上直接 `xcodebuild -scheme Husk` 会报 scheme 不存在。
schemes:
  Husk:
    build:
      targets:
        Husk: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
