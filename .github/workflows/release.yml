name: Release

# 两种发版方式，结果一样：
#   1. 打 tag 推上去：git tag v1.2.0 && git push origin v1.2.0
#   2. 在 Actions 页面手动跑这个 workflow，填版本号——tag 不存在时由 CI 建在
#      触发时所在的提交上。没有本地仓库、或者推 tag 的权限受限时用这条。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本，例如 v0.1.0（tag 不存在会自动建在当前提交上）'
        type: string
        required: true

permissions:
  contents: read

jobs:
  # 不复制一份编译步骤，直接复用 build.yml（它开了 workflow_call）。
  # 版本号从 tag 推出来，注入 MARKETING_VERSION。
  build:
    uses: ./.github/workflows/build.yml
    with:
      # tag 触发时 inputs 为空，取 ref_name；手动触发时取填的版本号
      version_tag: ${{ inputs.version || github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # 建 Release 要写权限。顶层是 read，这里按 job 单独放开。
      contents: write

    steps:
      - name: 取回编译产物
        # 版本要和 build.yml 里的 upload-artifact 配套，别单独升
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}

      - name: 建 Release 并附上 .ipa
        env:
          # 用 runner 自带的 gh，不引第三方 action
          GH_TOKEN: ${{ github.token }}
          IPA: ${{ needs.build.outputs.ipa_name }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          test -f "$IPA" || { echo "没拿到 $IPA"; ls -la; exit 1; }

          # 更新说明 = 一段未签名提示 + GitHub 按提交/PR 自动生成的那段。
          #
          # 刻意不用 `gh release create --generate-notes --notes "..."` 的组合：
          # 同时给这两个参数时 gh 到底会不会把自动生成的部分带上，行为并不明确，
          # 万一被吞掉就是"说明少了一半"且不报错。这里直接调 generate-notes 接口
          # 自己拼，结果是确定的。
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "附件里的 \`$IPA\` 是**未签名**的，直接装不上设备——用自己的证书签过才能用，步骤见 README 的「CI」一节。"
            echo
            # target_commitish 在 tag 尚不存在时是必填的（手动触发就是这种情况）
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$VERSION" -f target_commitish="$GITHUB_SHA" --jq .body \
              || echo "_自动生成更新说明失败，看提交记录吧。_"
          } > "$NOTES"

          # 带连字符的 tag（v1.2.0-beta1 这种）按 semver 惯例标成预发布
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          # --target 只在 tag 不存在时起作用（由它决定建在哪个提交上），
          # tag 已存在时 GitHub 会忽略，所以两条触发路径都能用同一行。
          gh release create "$VERSION" "$IPA" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Husk $VERSION" \
            --notes-file "$NOTES" \
            $PRERELEASE
